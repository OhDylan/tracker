<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="菜单">
<meta name="theme-color" content="#0f0f13">
<link rel="manifest" href="manifest.json">
<title>今天的菜单</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f13;
    --card: #1a1a22;
    --card-border: #2a2a35;
    --text: #e8e6e3;
    --text-secondary: #6b6979;
    --accent: #7c956b;
    --accent-glow: rgba(124,149,107,0.3);

    /* Rank colors */
    --bronze: linear-gradient(135deg, #cd7f32, #a0522d, #cd7f32);
    --silver: linear-gradient(135deg, #c0c0c0, #e8e8e8, #a8a8a8);
    --gold: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
    --platinum: linear-gradient(135deg, #40e0d0, #48d1cc, #7fffd4);
    --diamond: linear-gradient(135deg, #b9f2ff, #4fc3f7, #e0f7fa);
    --star: linear-gradient(135deg, #e040fb, #7c4dff, #e040fb);
    --king: linear-gradient(135deg, #ff6d00, #ff1744, #ffea00, #ff6d00);
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 100px 0;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* ============ HEADER ============ */
  .header {
    padding: 56px 24px 16px;
    position: relative;
  }

  .date-display {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .day-label {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .day-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 300;
  }

  /* ============ RANK CARD ============ */
  .rank-card {
    margin: 16px 24px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  .rank-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--current-rank-gradient);
    opacity: 0.8;
  }

  .rank-badge-mini {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    position: relative;
    flex-shrink: 0;
  }

  .rank-badge-mini::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--current-rank-gradient);
    z-index: -1;
    opacity: 0.6;
  }

  .rank-info { flex: 1; }

  .rank-name {
    font-size: 16px;
    font-weight: 700;
    background: var(--current-rank-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .rank-progress {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .progress-bar {
    margin-top: 8px;
    height: 6px;
    background: #2a2a35;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--current-rank-gradient);
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* ============ SECTION ============ */
  .section {
    padding: 0 24px;
    margin-top: 24px;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 500;
  }

  /* ============ MENU ITEMS ============ */
  .menu-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .menu-item:active { transform: scale(0.97); }

  .menu-item.done {
    border-color: var(--accent);
    background: rgba(124,149,107,0.08);
  }

  .menu-item.done .item-text {
    color: var(--accent);
  }

  .item-emoji {
    font-size: 22px;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
  }

  .item-content { flex: 1; }

  .item-text {
    font-size: 15px;
    font-weight: 400;
    transition: all 0.3s ease;
  }

  .item-note {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .menu-item.done .check {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .check svg {
    width: 12px; height: 12px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .menu-item.done .check svg { opacity: 1; }

  /* ============ DAILY BADGE ============ */
  .daily-badge-area {
    margin: 20px 24px;
    text-align: center;
    min-height: 40px;
  }

  .daily-complete {
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 20px;
    animation: badgePop 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .daily-complete::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, var(--accent-glow), transparent 70%);
  }

  .daily-badge-icon {
    font-size: 40px;
    margin-bottom: 8px;
    position: relative;
  }

  .daily-badge-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }

  .daily-badge-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  @keyframes badgePop {
    0% { transform: scale(0.8); opacity: 0; }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ============ SUBSTACK ============ */
  .substack-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
  }

  .substack-cycle {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cycle-info {
    font-size: 13px;
    color: var(--text);
  }

  .cycle-badge {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .publish-btn {
    margin-top: 12px;
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .publish-btn:active { opacity: 0.8; transform: scale(0.98); }

  .substack-badges {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: center;
  }

  .sub-badge {
    text-align: center;
    padding: 8px 12px;
    border-radius: 10px;
    background: #1f1f28;
    border: 1px solid var(--card-border);
    flex: 1;
    opacity: 0.4;
    transition: all 0.3s;
  }

  .sub-badge.earned {
    opacity: 1;
    border-color: transparent;
  }

  .sub-badge.earned.tier1 { border-color: #cd7f32; background: rgba(205,127,50,0.1); }
  .sub-badge.earned.tier2 { border-color: #ffd700; background: rgba(255,215,0,0.08); }
  .sub-badge.earned.tier3 { border-color: #e040fb; background: rgba(224,64,251,0.08); }

  .sub-badge-icon { font-size: 22px; }
  .sub-badge-label { font-size: 10px; margin-top: 3px; color: var(--text-secondary); }

  /* ============ WEEK VIEW ============ */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .week-day {
    text-align: center;
    padding: 8px 2px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
  }

  .week-day.today { border-color: var(--accent); }
  .week-day.perfect { border-color: #ffd700; background: rgba(255,215,0,0.06); }

  .week-day-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .week-day-num { font-size: 15px; font-weight: 500; }

  .week-day-icon {
    margin-top: 4px;
    font-size: 14px;
    min-height: 18px;
  }

  /* Streak */
  .streak-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
  }

  .streak-num {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6d00, #ff1744);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .streak-label {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .streak-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ============ MONTH VIEW ============ */
  .month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .month-nav-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }

  .month-nav-btn:active { transform: scale(0.95); }

  .month-title {
    font-size: 16px;
    font-weight: 500;
  }

  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .month-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    position: relative;
  }

  .month-cell.empty { background: transparent; border: none; }
  .month-cell.perfect { background: rgba(255,215,0,0.12); border-color: #ffd700; }
  .month-cell.partial { background: rgba(124,149,107,0.08); border-color: var(--accent); }
  .month-cell.today { box-shadow: 0 0 0 2px var(--accent); }
  .month-cell .dot { font-size: 9px; line-height: 1; margin-top: 1px; }
  .month-head {
    text-align: center;
    font-size: 10px;
    color: var(--text-secondary);
    padding-bottom: 4px;
  }

  .month-stats {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .month-stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }

  .month-stat-num {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .month-stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ============ BADGES COLLECTION ============ */
  .badges-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .badge-cell {
    text-align: center;
    padding: 12px 4px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    opacity: 0.3;
  }

  .badge-cell.earned { opacity: 1; }

  .badge-icon { font-size: 28px; }
  .badge-name { font-size: 10px; color: var(--text-secondary); margin-top: 4px; }
  .badge-date { font-size: 9px; color: var(--text-secondary); }

  /* ============ NAV ============ */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(15,15,19,0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--card-border);
    display: flex;
    padding: 8px 0 30px;
    z-index: 10;
  }

  .nav-item {
    flex: 1;
    text-align: center;
    padding: 6px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 10px;
    transition: color 0.2s;
  }

  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 20px; margin-bottom: 2px; }

  .page { display: none; }
  .page.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 32px 20px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  /* ============ CELEBRATION OVERLAY ============ */
  .celebration {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.3s ease;
    cursor: pointer;
  }

  .celebration.hidden { display: none; }

  .celeb-badge {
    font-size: 80px;
    animation: celebPop 0.6s ease;
  }

  .celeb-title {
    font-size: 24px;
    font-weight: 900;
    margin-top: 16px;
    background: var(--gold);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .celeb-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    text-align: center;
    padding: 0 24px;
  }

  .celeb-tap {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 24px;
    opacity: 0.5;
  }

  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    font-size: 20px;
    animation: particleFall 2s ease-in forwards;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes celebPop {
    0% { transform: scale(0) rotate(-20deg); }
    60% { transform: scale(1.2) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes particleFall {
    0% { transform: translateY(-20px) rotate(0); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- CELEBRATION OVERLAY -->
<div class="celebration hidden" id="celebration" onclick="closeCelebration()">
  <div class="particles" id="particles"></div>
  <div class="celeb-badge" id="celeb-badge"></div>
  <div class="celeb-title" id="celeb-title"></div>
  <div class="celeb-subtitle" id="celeb-subtitle"></div>
  <div class="celeb-tap">点击任意处关闭</div>
</div>

<!-- TODAY PAGE -->
<div id="page-today" class="page active">
  <div class="header">
    <div class="date-display" id="date-display"></div>
    <div class="day-label" id="day-label"></div>
    <div class="day-subtitle" id="day-subtitle"></div>
  </div>

  <div class="rank-card" id="rank-card">
    <div class="rank-badge-mini" id="rank-badge-mini"></div>
    <div class="rank-info">
      <div class="rank-name" id="rank-name"></div>
      <div class="rank-progress" id="rank-progress"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">今天的菜单</div>
    <div id="menu-items"></div>
  </div>

  <div class="daily-badge-area" id="daily-badge-area"></div>
</div>

<!-- WEEK PAGE -->
<div id="page-week" class="page">
  <div class="header">
    <div class="day-label">本周概览</div>
    <div class="day-subtitle" id="week-range"></div>
  </div>

  <div class="section">
    <div class="week-grid" id="week-grid"></div>
    <div class="streak-card">
      <div>
        <div class="streak-num" id="streak-num">0</div>
      </div>
      <div>
        <div class="streak-label" id="streak-label">天连续全勤</div>
        <div class="streak-sub" id="streak-sub">累计全勤 0 天</div>
      </div>
    </div>
  </div>

  <div id="weekly-tasks-container"></div>
</div>

<!-- MONTH PAGE -->
<div id="page-month" class="page">
  <div class="header">
    <div class="day-label">月度概览</div>
  </div>
  <div class="section">
    <div class="month-header">
      <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="month-title"></div>
      <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="month-grid" id="month-grid"></div>
    <div class="month-stats" id="month-stats"></div>
  </div>
</div>

<!-- BADGES PAGE -->
<div id="page-badges" class="page">
  <div class="header">
    <div class="day-label">徽章收藏</div>
    <div class="day-subtitle" id="badge-count"></div>
  </div>
  <div class="section">
    <div class="section-title">成就徽章</div>
    <div class="badges-grid" id="badges-grid"></div>
  </div>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('today', this)">
    <div class="nav-icon">📋</div><div>今天</div>
  </div>
  <div class="nav-item" onclick="switchPage('week', this)">
    <div class="nav-icon">📊</div><div>本周</div>
  </div>
  <div class="nav-item" onclick="switchPage('month', this)">
    <div class="nav-icon">🗓️</div><div>月度</div>
  </div>
  <div class="nav-item" onclick="switchPage('badges', this)">
    <div class="nav-icon">🏆</div><div>徽章</div>
  </div>
</div>

<script src="config.js"></script>
<script>
// ============ CONFIG ============
const SCHEDULE = window.CONFIG.schedule;
const RANKS = window.CONFIG.ranks;
const ACHIEVEMENT_BADGES = window.CONFIG.achievements;
const WEEKLY_TASKS = window.CONFIG.weeklyTasks || [];
if (window.CONFIG.appTitle) document.title = window.CONFIG.appTitle;

// ============ HELPERS ============
function getToday() { return new Date(); }

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getLog(key) {
  try { return JSON.parse(localStorage.getItem('log:' + key) || '[]'); } catch { return []; }
}

function setLog(key, items) { localStorage.setItem('log:' + key, JSON.stringify(items)); }

function getCurrentRank() {
  const n = getPerfectDays().length;
  let rank = RANKS[0];
  for (const r of RANKS) {
    if (n >= r.min) rank = r;
  }
  return rank;
}

function getNextRank() {
  const n = getPerfectDays().length;
  for (const r of RANKS) {
    if (n < r.min) return r;
  }
  return null;
}

// ============ WEEKLY TASKS ============
function weeklyKey(taskId) { return 'weekly:' + taskId; }

function getWeeklyEntries(taskId) {
  try { return JSON.parse(localStorage.getItem(weeklyKey(taskId)) || '[]'); } catch { return []; }
}

function setWeeklyEntries(taskId, entries) {
  localStorage.setItem(weeklyKey(taskId), JSON.stringify(entries));
}

function getWeeklyTotal(taskId) {
  return getWeeklyEntries(taskId).length;
}

function getTaskCycle(task, today) {
  const [y, m, d] = task.anchor;
  const start = new Date(y, m, d);
  const diff = Math.floor((today - start) / 86400000);
  const cycleNum = Math.max(0, Math.floor(diff / task.cycleDays));
  const cycleStart = new Date(start.getTime() + cycleNum * task.cycleDays * 86400000);
  const cycleEnd = new Date(cycleStart.getTime() + (task.cycleDays - 1) * 86400000);
  const daysLeft = Math.max(0, Math.ceil((cycleEnd - today) / 86400000) + 1);
  return { cycleNum, startDate: cycleStart, endDate: cycleEnd, daysLeft };
}

function getCycleCount(task, cycle) {
  const entries = getWeeklyEntries(task.id);
  const startKey = dateKey(cycle.startDate);
  const endKey = dateKey(cycle.endDate);
  return entries.filter(d => {
    const dateOnly = d.substring(0, 10);
    return dateOnly >= startKey && dateOnly <= endKey;
  }).length;
}

function getEarnedBadges() {
  try { return JSON.parse(localStorage.getItem('badges') || '[]'); } catch { return []; }
}

function earnBadge(id) {
  const earned = getEarnedBadges();
  if (earned.find(b => b.id === id)) return false;
  earned.push({ id, date: dateKey(getToday()) });
  localStorage.setItem('badges', JSON.stringify(earned));
  return true;
}

function getPerfectDays() {
  try { return JSON.parse(localStorage.getItem('perfectDays') || '[]'); } catch { return []; }
}

function markPerfectDay(key) {
  const days = getPerfectDays();
  if (!days.includes(key)) {
    days.push(key);
    localStorage.setItem('perfectDays', JSON.stringify(days));
  }
}

function unmarkPerfectDay(key) {
  let days = getPerfectDays();
  days = days.filter(d => d !== key);
  localStorage.setItem('perfectDays', JSON.stringify(days));
}

function getStreak() {
  const days = getPerfectDays().sort().reverse();
  if (days.length === 0) return 0;
  const today = dateKey(getToday());
  let checkDate = new Date(getToday());
  if (days[0] !== today) {
    checkDate.setDate(checkDate.getDate() - 1);
    if (days[0] !== dateKey(checkDate)) return 0;
  }
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const key = dateKey(checkDate);
    if (days.includes(key)) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function formatDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function formatShortDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ============ CELEBRATION ============
let celebQueue = [];
let celebShowing = false;

function showCelebration(icon, title, subtitle) {
  celebQueue.push({ icon, title, subtitle });
  if (!celebShowing) drainCeleb();
}

function drainCeleb() {
  if (celebQueue.length === 0) { celebShowing = false; return; }
  celebShowing = true;
  const { icon, title, subtitle } = celebQueue.shift();
  const el = document.getElementById('celebration');
  document.getElementById('celeb-badge').textContent = icon;
  document.getElementById('celeb-title').textContent = title;
  document.getElementById('celeb-subtitle').textContent = subtitle;

  const particles = document.getElementById('particles');
  particles.innerHTML = '';
  const emojis = ['✨','⭐','🌟','💫','🎉','🎊'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 1 + 's';
    p.style.animationDuration = (1.5 + Math.random()) + 's';
    particles.appendChild(p);
  }

  el.classList.remove('hidden');
}

function closeCelebration() {
  document.getElementById('celebration').classList.add('hidden');
  setTimeout(drainCeleb, 200);
}

// ============ CHECK BADGES ============
function checkBadges() {
  const streak = getStreak();
  const perfect = getPerfectDays().length;

  for (const b of ACHIEVEMENT_BADGES) {
    let unlocked = false;
    switch (b.type) {
      case 'first-perfect':  unlocked = perfect >= 1; break;
      case 'streak':         unlocked = streak >= (b.threshold || 0); break;
      case 'perfect-total':  unlocked = perfect >= (b.threshold || 0); break;
      case 'weekly-total':   unlocked = getWeeklyTotal(b.taskId) >= (b.threshold || 0); break;
    }
    if (unlocked && earnBadge(b.id)) {
      showCelebration(b.icon, b.name, b.desc);
    }
  }
}

// ============ RENDER TODAY ============
function renderRankCard() {
  const rank = getCurrentRank();
  const nextRank = getNextRank();
  const n = getPerfectDays().length;
  document.documentElement.style.setProperty('--current-rank-gradient', rank.gradient);
  document.getElementById('rank-badge-mini').textContent = rank.icon;
  document.getElementById('rank-name').textContent = rank.name;

  if (nextRank) {
    const progress = ((n - rank.min) / (nextRank.min - rank.min)) * 100;
    document.getElementById('rank-progress').textContent = `${n} / ${nextRank.min} 全勤日 · 下一段位 ${nextRank.name}`;
    document.getElementById('progress-fill').style.width = progress + '%';
  } else {
    document.getElementById('rank-progress').textContent = `${n} 全勤日 · 最高段位`;
    document.getElementById('progress-fill').style.width = '100%';
  }
}

function renderToday() {
  const today = getToday();
  const dow = today.getDay();
  const schedule = SCHEDULE[dow];
  const key = dateKey(today);
  const log = getLog(key);

  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('date-display').textContent = formatDate(today) + ' 星期' + days[dow];
  document.getElementById('day-label').textContent = schedule.label;
  document.getElementById('day-subtitle').textContent = schedule.subtitle;

  renderRankCard();

  // Menu items
  const container = document.getElementById('menu-items');
  container.innerHTML = '';

  schedule.items.forEach(item => {
    const isDone = log.includes(item.id);
    const el = document.createElement('div');
    el.className = 'menu-item' + (isDone ? ' done' : '');
    el.innerHTML = `
      <div class="item-emoji">${item.emoji}</div>
      <div class="item-content">
        <div class="item-text">${item.text}</div>
        ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
      </div>
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    `;
    el.addEventListener('click', () => toggleItem(item.id));
    container.appendChild(el);
  });

  // Daily badge
  const allDone = schedule.items.every(item => log.includes(item.id));
  const badgeArea = document.getElementById('daily-badge-area');

  if (allDone && schedule.items.length > 0) {
    const streak = getStreak();
    badgeArea.innerHTML = `
      <div class="daily-complete">
        <div class="daily-badge-icon">⭐</div>
        <div class="daily-badge-text">今日全勤！</div>
        <div class="daily-badge-sub">🔥 连续 ${streak} 天</div>
      </div>
    `;
  } else {
    const done = log.length;
    const total = schedule.items.length;
    badgeArea.innerHTML = total > 0 ? `<div style="color:var(--text-secondary);font-size:12px;">${done}/${total} 完成</div>` : '';
  }
}

function toggleItem(itemId) {
  const key = dateKey(getToday());
  const today = getToday();
  const dow = today.getDay();
  const schedule = SCHEDULE[dow];
  let log = getLog(key);

  const wasDone = log.includes(itemId);

  if (wasDone) {
    log = log.filter(i => i !== itemId);
    if (getPerfectDays().includes(key)) {
      unmarkPerfectDay(key);
    }
  } else {
    log.push(itemId);
    const nowPerfect = schedule.items.every(item => log.includes(item.id));
    if (nowPerfect && !getPerfectDays().includes(key)) {
      markPerfectDay(key);
      showCelebration('⭐', '今日全勤！', `🔥 连续 ${getStreak()} 天`);
      setTimeout(() => checkBadges(), 1200);
    }
  }

  setLog(key, log);
  renderToday();
}

function markWeeklyTask(taskId) {
  const task = WEEKLY_TASKS.find(t => t.id === taskId);
  if (!task) return;
  const today = getToday();
  const entries = getWeeklyEntries(taskId);
  entries.push(dateKey(today) + ':' + Date.now());
  setWeeklyEntries(taskId, entries);

  const cycle = getTaskCycle(task, today);
  const count = getCycleCount(task, cycle);
  // Find matching tier (highest tier whose count threshold is met)
  const tier = [...task.tiers].reverse().find(t => count === t.count);
  if (tier) {
    showCelebration(tier.icon, `${task.title} · ${tier.title}`, `本期第 ${count} 次`);
  } else if (count > 0) {
    const maxTier = task.tiers[task.tiers.length - 1];
    if (count > maxTier.count) {
      showCelebration('🌠', '超额完成！', `本期第 ${count} 次`);
    }
  }

  setTimeout(() => checkBadges(), 1200);
  renderWeek();
}

function undoWeeklyTask(taskId) {
  const entries = getWeeklyEntries(taskId);
  if (entries.length === 0) return;
  entries.pop();
  setWeeklyEntries(taskId, entries);
  renderWeek();
}

// ============ WEEK VIEW ============
function renderWeek() {
  const today = getToday();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((dow + 6) % 7));

  const dayLabels = ['一','二','三','四','五','六','日'];
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';

  const weekDates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    weekDates.push(d);
  }

  document.getElementById('week-range').textContent =
    `${formatShortDate(weekDates[0])} — ${formatShortDate(weekDates[6])}`;

  weekDates.forEach((d, i) => {
    const key = dateKey(d);
    const log = getLog(key);
    const isToday = key === dateKey(today);
    const isPerfect = getPerfectDays().includes(key);

    const el = document.createElement('div');
    el.className = 'week-day' + (isToday ? ' today' : '') + (isPerfect ? ' perfect' : '');
    el.innerHTML = `
      <div class="week-day-label">${dayLabels[i]}</div>
      <div class="week-day-num">${d.getDate()}</div>
      <div class="week-day-icon">${isPerfect ? '⭐' : (log.length > 0 ? '·' : '')}</div>
    `;
    grid.appendChild(el);
  });

  // Streak
  const streak = getStreak();
  document.getElementById('streak-num').textContent = streak;
  document.getElementById('streak-label').textContent = streak === 0 ? '还没开始' : '天连续全勤';
  document.getElementById('streak-sub').textContent = `累计全勤 ${getPerfectDays().length} 天`;

  // Weekly tasks
  renderWeeklyTasks();
}

function renderWeeklyTasks() {
  const today = getToday();
  const container = document.getElementById('weekly-tasks-container');
  container.innerHTML = '';

  WEEKLY_TASKS.forEach(task => {
    const cycle = getTaskCycle(task, today);
    const count = getCycleCount(task, cycle);
    const startStr = formatShortDate(cycle.startDate);
    const endStr = formatShortDate(cycle.endDate);

    const section = document.createElement('div');
    section.className = 'section';
    section.style.marginTop = '20px';

    const tiersHTML = task.tiers.map((tier, idx) => {
      const earned = count >= tier.count;
      const style = earned ? `border-color: ${tier.color}; background: ${tier.color}1a;` : '';
      return `
        <div class="sub-badge ${earned ? 'earned' : ''}" style="${style}">
          <div class="sub-badge-icon">${tier.icon}</div>
          <div class="sub-badge-label">${tier.label}</div>
        </div>
      `;
    }).join('');

    section.innerHTML = `
      <div class="section-title">${task.title}（每 ${task.cycleDays} 天）</div>
      <div class="substack-card">
        <div class="substack-cycle">
          <div class="cycle-info">${startStr} — ${endStr} · 剩 ${cycle.daysLeft} 天</div>
        </div>
        <div class="substack-badges">${tiersHTML}</div>
        <button class="publish-btn" data-task-id="${task.id}">完成 +1 (本期 ${count} 次)</button>
        <div style="text-align:center; margin-top:8px;">
          <span data-undo-task-id="${task.id}" style="font-size:11px; color:var(--text-secondary); cursor:pointer; text-decoration:underline;">撤销上一次</span>
        </div>
      </div>
    `;
    container.appendChild(section);
  });

  container.querySelectorAll('button[data-task-id]').forEach(btn => {
    btn.addEventListener('click', () => markWeeklyTask(btn.dataset.taskId));
  });
  container.querySelectorAll('[data-undo-task-id]').forEach(el => {
    el.addEventListener('click', () => undoWeeklyTask(el.dataset.undoTaskId));
  });
}

// ============ MONTH VIEW ============
let monthOffset = 0;

function changeMonth(delta) {
  monthOffset += delta;
  renderMonth();
}

function renderMonth() {
  const today = getToday();
  const view = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const year = view.getFullYear();
  const month = view.getMonth();

  document.getElementById('month-title').textContent = `${year} 年 ${month + 1} 月`;

  const grid = document.getElementById('month-grid');
  grid.innerHTML = '';

  // Headers
  const heads = ['一','二','三','四','五','六','日'];
  heads.forEach(h => {
    const el = document.createElement('div');
    el.className = 'month-head';
    el.textContent = h;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  // Monday-first offset (Mon=0..Sun=6)
  const startOffset = (firstDay.getDay() + 6) % 7;

  for (let i = 0; i < startOffset; i++) {
    const el = document.createElement('div');
    el.className = 'month-cell empty';
    grid.appendChild(el);
  }

  let perfectThisMonth = 0;
  let partialThisMonth = 0;
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(year, month, d);
    const key = dateKey(date);
    const log = getLog(key);
    const isPerfect = getPerfectDays().includes(key);
    const isToday = key === dateKey(today);
    const hasPartial = !isPerfect && log.length > 0;

    if (isPerfect) perfectThisMonth++;
    if (hasPartial) partialThisMonth++;

    const cell = document.createElement('div');
    cell.className = 'month-cell'
      + (isPerfect ? ' perfect' : (hasPartial ? ' partial' : ''))
      + (isToday ? ' today' : '');
    cell.innerHTML = `<div>${d}</div>${isPerfect ? '<div class="dot">⭐</div>' : (hasPartial ? '<div class="dot">·</div>' : '')}`;
    grid.appendChild(cell);
  }

  const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}`;
  const stats = document.getElementById('month-stats');
  let html = `
    <div class="month-stat">
      <div class="month-stat-num" style="color:#ffd700">${perfectThisMonth}</div>
      <div class="month-stat-label">全勤天</div>
    </div>
    <div class="month-stat">
      <div class="month-stat-num" style="color:var(--accent)">${partialThisMonth}</div>
      <div class="month-stat-label">部分完成</div>
    </div>
  `;
  WEEKLY_TASKS.forEach(task => {
    const n = getWeeklyEntries(task.id).filter(d => d.startsWith(monthPrefix)).length;
    html += `
      <div class="month-stat">
        <div class="month-stat-num">${n}</div>
        <div class="month-stat-label">${task.title}</div>
      </div>
    `;
  });
  stats.innerHTML = html;
}

// ============ BADGES PAGE ============
function renderBadges() {
  const earned = getEarnedBadges();
  const grid = document.getElementById('badges-grid');
  grid.innerHTML = '';

  document.getElementById('badge-count').textContent = `已获得 ${earned.length} / ${ACHIEVEMENT_BADGES.length}`;

  ACHIEVEMENT_BADGES.forEach(badge => {
    const e = earned.find(b => b.id === badge.id);
    const el = document.createElement('div');
    el.className = 'badge-cell' + (e ? ' earned' : '');
    el.innerHTML = `
      <div class="badge-icon">${badge.icon}</div>
      <div class="badge-name">${badge.name}</div>
      ${e ? `<div class="badge-date">${e.date.slice(5)}</div>` : `<div class="badge-date" style="opacity:0.4">${badge.desc}</div>`}
    `;
    grid.appendChild(el);
  });
}

// ============ NAV ============
function switchPage(page, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  el.classList.add('active');

  if (page === 'week') renderWeek();
  if (page === 'month') renderMonth();
  if (page === 'badges') renderBadges();
  if (page === 'today') renderToday();
}

// ============ SERVICE WORKER ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ============ MIGRATION (旧 key → 新 key) ============
(function migrate() {
  const old = localStorage.getItem('substack:published');
  if (old && !localStorage.getItem('weekly:substack')) {
    localStorage.setItem('weekly:substack', old);
  }
})();

// ============ INIT ============
renderToday();
</script>
